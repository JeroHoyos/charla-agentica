[project]
name = "charla-agentica-practica"
version = "0.1.0"
description = "Notebooks del taller «De Prompts a Agentes»"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.1",
    "python-dotenv>=1.2",
    "langchain>=1.4",
    "langchain-google-genai>=4.0",
    "langgraph>=1.2",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.21",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
